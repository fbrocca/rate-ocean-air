name: Audi deal scan

# Runs daily, scans nationwide Audi inventory, emails great deals, and commits
# the updated price history + latest report back to the repo.

on:
  schedule:
    # 13:00 UTC ≈ 9am ET / 6am PT. Adjust to taste (cron is UTC).
    - cron: "0 13 * * *"
  workflow_dispatch: {}        # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write              # needed to commit history + report back

concurrency:
  group: audi-deals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal scan
        env:
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m audi_deals.cli --config config.yaml

      - name: Commit updated history & report
        run: |
          git config user.name "audi-deals-bot"
          git config user.email "actions@github.com"
          git add data/history.json data/report-latest.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(audi-deals): daily scan $(date -u +%Y-%m-%d)"
            git push
          fi
